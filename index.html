<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#0a0a1a">
	<meta name="description" content="Mark where you parked and navigate back to your car">
	<title>ParkMe</title>
	<link rel="manifest" href="manifest.json">
	<link rel="apple-touch-icon" href="icon-192.png">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
	<style>
		*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

		:root {
			--bg: #0a0a1a;
			--card: #141428;
			--card2: #1c1c38;
			--accent: #33ccff;
			--accent2: #ff4d6a;
			--waze-green: #00d672;
			--waze-blue: #33ccff;
			--text: #eef0f6;
			--muted: #6b7294;
			--dim: #3a3a5c;
			--radius: 18px;
			--safe-top: env(safe-area-inset-top, 0px);
			--safe-bottom: env(safe-area-inset-bottom, 0px);
		}

		html, body { height: 100%; overflow: hidden; }

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
			background: var(--bg);
			color: var(--text);
			-webkit-user-select: none;
			user-select: none;
			-webkit-tap-highlight-color: transparent;
		}

		.app {
			height: 100%;
			display: flex;
			flex-direction: column;
			padding-top: var(--safe-top);
		}

		/* HEADER */
		.header {
			padding: 10px 16px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			background: var(--card);
			border-bottom: 1px solid rgba(255,255,255,0.04);
			flex-shrink: 0;
			z-index: 10;
		}
		.header h1 {
			font-size: 19px;
			font-weight: 800;
			display: flex;
			align-items: center;
			gap: 8px;
			letter-spacing: -0.3px;
		}
		.header h1 em { font-style: normal; color: var(--accent); }
		.header-actions { display: flex; gap: 6px; }
		.icon-btn {
			width: 38px;
			height: 38px;
			border-radius: 12px;
			border: none;
			background: rgba(255,255,255,0.05);
			color: var(--muted);
			font-size: 17px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.15s;
		}
		.icon-btn:active { background: rgba(51,204,255,0.15); color: var(--accent); transform: scale(0.9); }

		/* MAP */
		.map-wrap {
			flex: 1;
			position: relative;
			min-height: 0;
		}
		#map { width: 100%; height: 100%; z-index: 1; }
		.leaflet-control-attribution { display: none !important; }
		.leaflet-control-zoom { display: none !important; }

		/* SPEED PILL */
		.speed-pill {
			position: absolute;
			top: 12px;
			left: 12px;
			z-index: 5;
			background: rgba(20,20,40,0.88);
			backdrop-filter: blur(16px);
			border-radius: 14px;
			padding: 8px 14px;
			display: none;
			align-items: center;
			gap: 8px;
			border: 1px solid rgba(255,255,255,0.06);
		}
		.speed-pill.visible { display: flex; }
		.speed-val { font-size: 22px; font-weight: 800; color: var(--waze-green); line-height: 1; }
		.speed-unit { font-size: 11px; color: var(--muted); font-weight: 600; }

		/* NAV INFO BAR */
		.nav-bar {
			position: absolute;
			top: 12px;
			left: 12px;
			right: 12px;
			z-index: 5;
			background: rgba(20,20,40,0.9);
			backdrop-filter: blur(16px);
			border-radius: var(--radius);
			padding: 14px 16px;
			border: 1px solid rgba(255,255,255,0.06);
			display: none;
		}
		.nav-bar.visible { display: block; }
		.nav-bar-row { display: flex; align-items: center; justify-content: space-between; }
		.nav-bar-left { display: flex; align-items: center; gap: 12px; }
		.nav-bar-icon {
			width: 42px; height: 42px;
			border-radius: 50%;
			background: linear-gradient(135deg, var(--accent), #0088cc);
			display: flex; align-items: center; justify-content: center;
			font-size: 20px;
			box-shadow: 0 4px 16px rgba(51,204,255,0.25);
		}
		.nav-bar-text h3 { font-size: 15px; font-weight: 700; }
		.nav-bar-text p { font-size: 12px; color: var(--muted); margin-top: 1px; }
		.nav-bar-dist { font-size: 22px; font-weight: 800; color: var(--waze-green); }
		.nav-bar-eta { font-size: 11px; color: var(--muted); text-align: right; }

		/* COMPASS */
		.compass-wrap {
			position: absolute;
			bottom: 200px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 5;
			display: none;
			flex-direction: column;
			align-items: center;
			gap: 6px;
		}
		.compass-wrap.visible { display: flex; }
		.compass-outer {
			width: 110px;
			height: 110px;
			border-radius: 50%;
			background: rgba(20,20,40,0.9);
			backdrop-filter: blur(16px);
			border: 2px solid rgba(51,204,255,0.25);
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 0 30px rgba(51,204,255,0.05);
		}
		.compass-arrow {
			width: 0; height: 0;
			border-left: 14px solid transparent;
			border-right: 14px solid transparent;
			border-bottom: 50px solid var(--accent);
			filter: drop-shadow(0 0 8px rgba(51,204,255,0.5));
			transition: transform 0.15s ease-out;
		}
		.compass-label {
			font-size: 11px;
			color: var(--muted);
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		/* BOTTOM SHEET */
		.bottom-sheet {
			position: absolute;
			bottom: 0;
			left: 0;
			right: 0;
			z-index: 8;
			background: var(--card);
			border-radius: 24px 24px 0 0;
			padding: 12px 16px;
			padding-bottom: calc(16px + var(--safe-bottom));
			transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
			box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
			border-top: 1px solid rgba(255,255,255,0.06);
		}
		.sheet-handle {
			width: 36px;
			height: 4px;
			background: var(--dim);
			border-radius: 4px;
			margin: 0 auto 14px;
		}
		.sheet-timer {
			text-align: center;
			font-size: 12px;
			color: var(--muted);
			margin-bottom: 10px;
			display: none;
		}
		.sheet-timer.visible { display: block; }
		.sheet-timer span { color: var(--accent); font-weight: 700; }

		/* PARKING DETAILS */
		.park-details {
			display: none;
			gap: 8px;
			margin-bottom: 12px;
		}
		.park-details.visible { display: flex; }
		.park-detail-chip {
			flex: 1;
			background: var(--card2);
			border-radius: 12px;
			padding: 10px;
			text-align: center;
			border: 1px solid rgba(255,255,255,0.04);
		}
		.park-detail-chip label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
		.park-detail-chip .val { font-size: 14px; font-weight: 700; color: var(--text); }

		/* BUTTONS */
		.action-btn {
			width: 100%;
			padding: 16px;
			border-radius: 14px;
			border: none;
			font-size: 16px;
			font-weight: 700;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			transition: all 0.15s;
			letter-spacing: 0.3px;
		}
		.action-btn:active { transform: scale(0.97); }
		.action-btn.park {
			background: linear-gradient(135deg, var(--accent), #0099dd);
			color: #fff;
			box-shadow: 0 4px 24px rgba(51,204,255,0.3);
		}
		.action-btn.go {
			background: linear-gradient(135deg, var(--waze-green), #00b060);
			color: #0a0a1a;
			box-shadow: 0 4px 24px rgba(0,214,114,0.3);
		}
		.action-btn.stop {
			background: var(--accent2);
			color: #fff;
			box-shadow: 0 4px 20px rgba(255,77,106,0.25);
		}
		.btn-row { display: flex; gap: 8px; }
		.btn-row .action-btn { flex: 1; }
		.btn-row .action-btn.icon-only { flex: 0; width: 54px; min-width: 54px; padding: 16px 0; font-size: 18px; }

		/* FAB BUTTONS */
		.fab-group {
			position: absolute;
			right: 12px;
			bottom: 200px;
			z-index: 6;
			display: flex;
			flex-direction: column;
			gap: 8px;
		}
		.fab {
			width: 46px;
			height: 46px;
			border-radius: 50%;
			border: none;
			background: rgba(20,20,40,0.9);
			backdrop-filter: blur(12px);
			color: var(--muted);
			font-size: 18px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 4px 16px rgba(0,0,0,0.3);
			border: 1px solid rgba(255,255,255,0.06);
			transition: all 0.15s;
		}
		.fab:active { transform: scale(0.9); color: var(--accent); }

		/* TOAST */
		.toast {
			position: absolute;
			top: 60px;
			left: 50%;
			transform: translateX(-50%) translateY(-20px);
			z-index: 30;
			background: var(--waze-green);
			color: #0a0a1a;
			padding: 10px 20px;
			border-radius: 14px;
			font-size: 14px;
			font-weight: 700;
			opacity: 0;
			transition: all 0.3s;
			pointer-events: none;
			white-space: nowrap;
			box-shadow: 0 4px 20px rgba(0,214,114,0.3);
		}
		.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
		.toast.error { background: var(--accent2); color: #fff; box-shadow: 0 4px 20px rgba(255,77,106,0.3); }

		/* LOADING */
		.loading-screen {
			position: absolute;
			inset: 0;
			z-index: 50;
			background: var(--bg);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 16px;
			transition: opacity 0.4s;
		}
		.loading-screen.hidden { opacity: 0; pointer-events: none; }
		.loading-icon { font-size: 52px; animation: bob 1.5s ease-in-out infinite; }
		.loading-screen p { color: var(--muted); font-size: 14px; }
		@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

		/* HISTORY PANEL */
		.history-panel {
			position: absolute;
			top: 0; right: 0; bottom: 0;
			width: 280px;
			z-index: 40;
			background: var(--card);
			transform: translateX(100%);
			transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			border-left: 1px solid rgba(255,255,255,0.06);
			overflow-y: auto;
		}
		.history-panel.open { transform: translateX(0); }
		.history-overlay {
			position: absolute;
			inset: 0;
			z-index: 35;
			background: rgba(0,0,0,0.5);
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.3s;
		}
		.history-overlay.open { opacity: 1; pointer-events: auto; }
		.history-header {
			padding: 16px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			border-bottom: 1px solid rgba(255,255,255,0.06);
		}
		.history-header h2 { font-size: 17px; font-weight: 700; }
		.history-item {
			padding: 14px 16px;
			border-bottom: 1px solid rgba(255,255,255,0.03);
			display: flex;
			align-items: center;
			gap: 12px;
			cursor: pointer;
			transition: background 0.15s;
		}
		.history-item:active { background: rgba(255,255,255,0.03); }
		.history-item .hi-icon {
			width: 36px; height: 36px;
			border-radius: 10px;
			background: rgba(51,204,255,0.1);
			display: flex; align-items: center; justify-content: center;
			font-size: 16px;
			flex-shrink: 0;
		}
		.history-item .hi-text { font-size: 13px; color: var(--text); }
		.history-item .hi-text small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
		.history-empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13px; }

		/* NOTE INPUT MODAL */
		.modal-overlay {
			position: fixed;
			inset: 0;
			z-index: 50;
			background: rgba(0,0,0,0.6);
			display: none;
			align-items: flex-end;
			justify-content: center;
		}
		.modal-overlay.open { display: flex; }
		.modal-content {
			width: 100%;
			max-width: 420px;
			background: var(--card);
			border-radius: 24px 24px 0 0;
			padding: 20px 16px;
			padding-bottom: calc(20px + var(--safe-bottom));
		}
		.modal-content h3 { font-size: 17px; font-weight: 700; margin-bottom: 16px; text-align: center; }
		.modal-input {
			width: 100%;
			padding: 14px;
			border-radius: 12px;
			border: 1px solid var(--dim);
			background: var(--card2);
			color: var(--text);
			font-size: 15px;
			font-family: inherit;
			margin-bottom: 10px;
			outline: none;
		}
		.modal-input:focus { border-color: var(--accent); }
		.modal-input::placeholder { color: var(--muted); }
		.modal-row { display: flex; gap: 8px; }
		.modal-row .modal-input { flex: 1; }
		.modal-btn-row { display: flex; gap: 8px; margin-top: 14px; }
		.modal-btn {
			flex: 1;
			padding: 14px;
			border-radius: 12px;
			border: none;
			font-size: 15px;
			font-weight: 700;
			cursor: pointer;
		}
		.modal-btn.cancel { background: var(--card2); color: var(--muted); }
		.modal-btn.confirm { background: var(--accent); color: #fff; }

		/* CELEBRATION */
		.celebration {
			position: fixed;
			inset: 0;
			z-index: 60;
			display: none;
			align-items: center;
			justify-content: center;
			background: rgba(10,10,26,0.85);
		}
		.celebration.show { display: flex; }
		.celebration-inner {
			text-align: center;
			animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
		}
		.celebration-icon { font-size: 72px; margin-bottom: 16px; }
		.celebration-inner h2 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
		.celebration-inner p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
		@keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

		/* MARKERS */
		.car-marker {
			background: none;
			border: none;
			font-size: 36px;
			text-shadow: 0 3px 12px rgba(0,0,0,0.6);
			filter: drop-shadow(0 0 6px rgba(51,204,255,0.4));
		}
		.you-marker {
			width: 16px;
			height: 16px;
			background: var(--accent);
			border: 3px solid #fff;
			border-radius: 50%;
			box-shadow: 0 0 16px rgba(51,204,255,0.6), 0 0 40px rgba(51,204,255,0.2);
		}
		.you-pulse {
			width: 40px;
			height: 40px;
			border-radius: 50%;
			background: rgba(51,204,255,0.15);
			animation: pulse-ring 2s ease-out infinite;
		}
		@keyframes pulse-ring { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
	</style>
</head>
<body>
	<div class="app">
		<header class="header">
			<h1>🚗 Park<em>Me</em></h1>
			<div class="header-actions">
				<button class="icon-btn" id="btn-center" title="Center">🎯</button>
				<button class="icon-btn" id="btn-history" title="History">🕐</button>
			</div>
		</header>

		<div class="map-wrap">
			<div id="map"></div>

			<div class="loading-screen" id="loading">
				<div class="loading-icon">📡</div>
				<p>Getting your location...</p>
			</div>

			<!-- Speed pill (during navigation) -->
			<div class="speed-pill" id="speed-pill">
				<div><span class="speed-val" id="speed-val">0</span><span class="speed-unit"> km/h</span></div>
			</div>

			<!-- Nav info bar (during navigation) -->
			<div class="nav-bar" id="nav-bar">
				<div class="nav-bar-row">
					<div class="nav-bar-left">
						<div class="nav-bar-icon">🚗</div>
						<div class="nav-bar-text">
							<h3 id="nav-title">Navigating to car</h3>
							<p id="nav-subtitle">Follow the arrow</p>
						</div>
					</div>
					<div style="text-align:right">
						<div class="nav-bar-dist" id="nav-dist">0 m</div>
						<div class="nav-bar-eta" id="nav-eta">~0 min</div>
					</div>
				</div>
			</div>

			<!-- Compass -->
			<div class="compass-wrap" id="compass">
				<div class="compass-outer">
					<div class="compass-arrow" id="compass-arrow"></div>
				</div>
				<div class="compass-label">direction to car</div>
			</div>

			<!-- FAB buttons -->
			<div class="fab-group" id="fab-group">
				<button class="fab" id="fab-center" title="Center">🎯</button>
				<button class="fab" id="fab-zoom-in" title="Zoom in">+</button>
				<button class="fab" id="fab-zoom-out" title="Zoom out">−</button>
			</div>

			<!-- Bottom sheet -->
			<div class="bottom-sheet" id="sheet">
				<div class="sheet-handle"></div>
				<div class="sheet-timer" id="sheet-timer">Parked <span id="timer-val">just now</span></div>
				<div class="park-details" id="park-details">
					<div class="park-detail-chip"><label>Floor</label><div class="val" id="detail-floor">—</div></div>
					<div class="park-detail-chip"><label>Zone</label><div class="val" id="detail-zone">—</div></div>
					<div class="park-detail-chip"><label>Spot</label><div class="val" id="detail-spot">—</div></div>
				</div>
				<div id="sheet-actions">
					<button class="action-btn park" id="btn-park" onclick="parkCar()">📍 Park Here</button>
				</div>
			</div>

			<div class="toast" id="toast"></div>
		</div>
	</div>

	<!-- History panel -->
	<div class="history-overlay" id="history-overlay"></div>
	<div class="history-panel" id="history-panel">
		<div class="history-header">
			<h2>🕐 History</h2>
			<button class="icon-btn" id="close-history">✕</button>
		</div>
		<div id="history-list"></div>
	</div>

	<!-- Note modal -->
	<div class="modal-overlay" id="note-modal">
		<div class="modal-content">
			<h3>📝 Parking Details</h3>
			<div class="modal-row">
				<input class="modal-input" id="input-floor" placeholder="Floor (e.g. B2)">
				<input class="modal-input" id="input-zone" placeholder="Zone (e.g. A)">
				<input class="modal-input" id="input-spot" placeholder="Spot #">
			</div>
			<input class="modal-input" id="input-note" placeholder="Notes (e.g. near elevator)">
			<div class="modal-btn-row">
				<button class="modal-btn cancel" onclick="closeNoteModal(false)">Skip</button>
				<button class="modal-btn confirm" onclick="closeNoteModal(true)">Save</button>
			</div>
		</div>
	</div>

	<!-- Celebration -->
	<div class="celebration" id="celebration">
		<div class="celebration-inner">
			<div class="celebration-icon">🎉</div>
			<h2>You found your car!</h2>
			<p id="celeb-text">Great job navigating</p>
			<button class="action-btn park" style="max-width:200px;margin:0 auto" onclick="dismissCelebration()">Awesome!</button>
		</div>
	</div>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script>
		// ===== STATE =====
		var map, userMarker, userPulse, carMarker, routeLine;
		var userPos = null, prevPos = null, carPos = null;
		var watchId = null, navigating = false, parkedAt = null;
		var deviceHeading = null, currentSpeed = 0;
		var parkNote = { floor: '', zone: '', spot: '', note: '' };

		// ===== INIT =====
		function init() {
			map = L.map('map', {
				zoomControl: false,
				attributionControl: false
			}).setView([42.7, 23.32], 16);

			L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
				maxZoom: 20
			}).addTo(map);

			loadSavedCar();
			startTracking();
			startCompass();
		}

		// ===== GPS =====
		function startTracking() {
			if (!navigator.geolocation) {
				showToast('GPS not supported', true);
				hide('loading');
				return;
			}
			watchId = navigator.geolocation.watchPosition(
				function(pos) {
					prevPos = userPos;
					userPos = {
						lat: pos.coords.latitude,
						lng: pos.coords.longitude,
						accuracy: pos.coords.accuracy,
						speed: pos.coords.speed
					};
					currentSpeed = pos.coords.speed != null ? Math.round(pos.coords.speed * 3.6) : 0;
					updateUserMarker();
					hide('loading');
					if (navigating && carPos) updateNavigation();
				},
				function() {
					hide('loading');
					showToast('Enable location access', true);
				},
				{ enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 }
			);
		}

		function updateUserMarker() {
			if (!userPos) return;
			var ll = [userPos.lat, userPos.lng];
			if (!userMarker) {
				var pulseIcon = L.divIcon({ className: 'you-pulse', iconSize: [40,40], iconAnchor: [20,20] });
				userPulse = L.marker(ll, { icon: pulseIcon, zIndexOffset: 999 }).addTo(map);
				var icon = L.divIcon({ className: 'you-marker', iconSize: [16,16], iconAnchor: [8,8] });
				userMarker = L.marker(ll, { icon: icon, zIndexOffset: 1000 }).addTo(map);
				map.setView(ll, 17);
			} else {
				userMarker.setLatLng(ll);
				userPulse.setLatLng(ll);
			}
		}

		// ===== COMPASS (Device Orientation) =====
		function startCompass() {
			if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
				// iOS 13+ requires permission
				document.addEventListener('click', function iosCompass() {
					DeviceOrientationEvent.requestPermission().then(function(r) {
						if (r === 'granted') window.addEventListener('deviceorientation', onDeviceOrientation);
					});
					document.removeEventListener('click', iosCompass);
				}, { once: true });
			} else {
				window.addEventListener('deviceorientationabsolute', onDeviceOrientation, true);
				window.addEventListener('deviceorientation', onDeviceOrientation);
			}
		}

		function onDeviceOrientation(e) {
			if (e.absolute !== undefined && e.alpha !== null) {
				deviceHeading = e.alpha;
				if (e.webkitCompassHeading !== undefined) deviceHeading = e.webkitCompassHeading;
			} else if (e.alpha !== null) {
				deviceHeading = 360 - e.alpha;
			}
		}

		// ===== PARK =====
		function parkCar() {
			if (!userPos) { showToast('Waiting for GPS...', true); return; }
			carPos = { lat: userPos.lat, lng: userPos.lng };
			parkedAt = Date.now();
			// Show note modal
			document.getElementById('note-modal').classList.add('open');
			vibrate(20);
		}

		function closeNoteModal(save) {
			document.getElementById('note-modal').classList.remove('open');
			if (save) {
				parkNote.floor = document.getElementById('input-floor').value.trim();
				parkNote.zone = document.getElementById('input-zone').value.trim();
				parkNote.spot = document.getElementById('input-spot').value.trim();
				parkNote.note = document.getElementById('input-note').value.trim();
			} else {
				parkNote = { floor: '', zone: '', spot: '', note: '' };
			}
			// Clear inputs
			document.getElementById('input-floor').value = '';
			document.getElementById('input-zone').value = '';
			document.getElementById('input-spot').value = '';
			document.getElementById('input-note').value = '';

			finishParking();
		}

		function finishParking() {
			saveCar();
			placeCarMarker();
			showParkedUI();
			showToast('Car location saved!');
			map.setView([carPos.lat, carPos.lng], 17);
			vibrate(30);
		}

		function placeCarMarker() {
			if (carMarker) map.removeLayer(carMarker);
			var icon = L.divIcon({ className: 'car-marker', html: '🚗', iconSize: [36,36], iconAnchor: [18,18] });
			carMarker = L.marker([carPos.lat, carPos.lng], { icon: icon, zIndexOffset: 500 }).addTo(map);
		}

		// ===== NAVIGATE =====
		function startNav() {
			if (!carPos || !userPos) return;
			navigating = true;
			showNavUI();
			updateNavigation();
			fetchRoute();
			var bounds = L.latLngBounds([[userPos.lat, userPos.lng], [carPos.lat, carPos.lng]]);
			map.fitBounds(bounds, { padding: [100, 80] });
			vibrate(15);
		}

		function updateNavigation() {
			if (!carPos || !userPos) return;
			var dist = getDist(userPos.lat, userPos.lng, carPos.lat, carPos.lng);
			var bearing = getBearing(userPos.lat, userPos.lng, carPos.lat, carPos.lng);

			// Compass arrow - account for device heading
			var rotation = bearing;
			if (deviceHeading !== null) rotation = bearing - deviceHeading;
			document.getElementById('compass-arrow').style.transform = 'rotate(' + rotation + 'deg)';

			// Distance
			var dt = dist > 999 ? (dist/1000).toFixed(1) + ' km' : Math.round(dist) + ' m';
			document.getElementById('nav-dist').textContent = dt;

			// ETA
			var mins = Math.max(1, Math.round(dist / 1000 / 5 * 60));
			var etaText = dist < 15 ? 'Arrived!' : '~' + mins + ' min walk';
			document.getElementById('nav-eta').textContent = etaText;
			document.getElementById('nav-subtitle').textContent = dt + ' away';

			// Speed
			document.getElementById('speed-val').textContent = Math.max(0, currentSpeed);

			// Arrived?
			if (dist < 15) {
				celebrate();
			}
		}

		function fetchRoute() {
			if (!carPos || !userPos) return;
			var url = 'https://router.project-osrm.org/route/v1/foot/' +
				userPos.lng + ',' + userPos.lat + ';' + carPos.lng + ',' + carPos.lat +
				'?overview=full&geometries=geojson';
			fetch(url).then(function(r) { return r.json(); }).then(function(data) {
				if (data.routes && data.routes[0]) {
					var coords = data.routes[0].geometry.coordinates.map(function(c) { return [c[1], c[0]]; });
					if (routeLine) map.removeLayer(routeLine);
					routeLine = L.polyline(coords, {
						color: '#33ccff', weight: 5, opacity: 0.8,
						lineCap: 'round', lineJoin: 'round'
					}).addTo(map);
				}
			}).catch(function() {
				// Fallback: straight line
				if (routeLine) map.removeLayer(routeLine);
				routeLine = L.polyline([[userPos.lat, userPos.lng], [carPos.lat, carPos.lng]], {
					color: '#33ccff', weight: 3, dashArray: '8,8', opacity: 0.6
				}).addTo(map);
			});
		}

		function stopNav() {
			navigating = false;
			if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
			document.getElementById('compass').classList.remove('visible');
			document.getElementById('nav-bar').classList.remove('visible');
			document.getElementById('speed-pill').classList.remove('visible');
			showParkedUI();
		}

		function clearCar() {
			if (carMarker) { map.removeLayer(carMarker); carMarker = null; }
			if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
			carPos = null; parkedAt = null; navigating = false;
			parkNote = { floor: '', zone: '', spot: '', note: '' };
			localStorage.removeItem('parkme_car');
			localStorage.removeItem('parkme_time');
			localStorage.removeItem('parkme_note');
			document.getElementById('compass').classList.remove('visible');
			document.getElementById('nav-bar').classList.remove('visible');
			document.getElementById('speed-pill').classList.remove('visible');
			showDefaultUI();
			showToast('Parking cleared');
			vibrate(15);
		}

		function shareCar() {
			if (!carPos) return;
			var url = 'https://www.google.com/maps?q=' + carPos.lat + ',' + carPos.lng;
			var text = '🚗 My car is parked here: ' + url;
			if (navigator.share) {
				navigator.share({ title: 'My Parked Car', text: text, url: url });
			} else {
				navigator.clipboard.writeText(text).then(function() { showToast('Link copied!'); });
			}
		}

		function openGMaps() {
			if (!carPos) return;
			window.open('https://www.google.com/maps/dir/?api=1&destination=' + carPos.lat + ',' + carPos.lng + '&travelmode=walking', '_blank');
		}

		// ===== CELEBRATE =====
		function celebrate() {
			navigating = false;
			if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
			document.getElementById('compass').classList.remove('visible');
			document.getElementById('nav-bar').classList.remove('visible');
			document.getElementById('speed-pill').classList.remove('visible');

			var diff = parkedAt ? Date.now() - parkedAt : 0;
			var mins = Math.floor(diff / 60000);
			var celebText = mins > 0 ? 'Walked back in ' + mins + ' min' : 'That was quick!';
			document.getElementById('celeb-text').textContent = celebText;
			document.getElementById('celebration').classList.add('show');
			vibrate([50, 50, 50, 50, 100]);
		}

		function dismissCelebration() {
			document.getElementById('celebration').classList.remove('show');
			clearCar();
		}

		// ===== UI STATES =====
		function showDefaultUI() {
			var el = document.getElementById('sheet-actions');
			el.innerHTML = '<button class="action-btn park" onclick="parkCar()">📍 Park Here</button>';
			document.getElementById('sheet-timer').classList.remove('visible');
			document.getElementById('park-details').classList.remove('visible');
		}

		function showParkedUI() {
			var el = document.getElementById('sheet-actions');
			el.innerHTML =
				'<div class="btn-row">' +
					'<button class="action-btn go" onclick="startNav()">🧭 Navigate</button>' +
					'<button class="action-btn icon-only" style="background:var(--card2);color:var(--muted)" onclick="shareCar()">📤</button>' +
					'<button class="action-btn stop icon-only" onclick="clearCar()">✕</button>' +
				'</div>';
			document.getElementById('compass').classList.remove('visible');
			document.getElementById('nav-bar').classList.remove('visible');
			document.getElementById('speed-pill').classList.remove('visible');
			updateTimer();
			updateDetails();
		}

		function showNavUI() {
			var el = document.getElementById('sheet-actions');
			el.innerHTML =
				'<div class="btn-row">' +
					'<button class="action-btn park" onclick="openGMaps()">🗺 Google Maps</button>' +
					'<button class="action-btn stop icon-only" onclick="stopNav()">■</button>' +
				'</div>';
			document.getElementById('compass').classList.add('visible');
			document.getElementById('nav-bar').classList.add('visible');
			document.getElementById('speed-pill').classList.add('visible');
			updateTimer();
		}

		function updateTimer() {
			if (!parkedAt) return;
			var el = document.getElementById('sheet-timer');
			var diff = Date.now() - parkedAt;
			var mins = Math.floor(diff / 60000);
			var hrs = Math.floor(mins / 60);
			mins = mins % 60;
			var t = hrs > 0 ? hrs + 'h ' + mins + 'm ago' : mins > 0 ? mins + ' min ago' : 'just now';
			document.getElementById('timer-val').textContent = t;
			el.classList.add('visible');
		}

		function updateDetails() {
			var el = document.getElementById('park-details');
			if (parkNote.floor || parkNote.zone || parkNote.spot) {
				document.getElementById('detail-floor').textContent = parkNote.floor || '—';
				document.getElementById('detail-zone').textContent = parkNote.zone || '—';
				document.getElementById('detail-spot').textContent = parkNote.spot || '—';
				el.classList.add('visible');
			} else {
				el.classList.remove('visible');
			}
		}

		setInterval(updateTimer, 30000);

		// ===== HISTORY =====
		function openHistory() {
			renderHistory();
			document.getElementById('history-panel').classList.add('open');
			document.getElementById('history-overlay').classList.add('open');
		}

		function closeHistory() {
			document.getElementById('history-panel').classList.remove('open');
			document.getElementById('history-overlay').classList.remove('open');
		}

		function renderHistory() {
			var history = JSON.parse(localStorage.getItem('parkme_history') || '[]');
			var el = document.getElementById('history-list');
			if (!history.length) {
				el.innerHTML = '<div class="history-empty">No parking history yet</div>';
				return;
			}
			el.innerHTML = history.slice(0, 15).map(function(h, i) {
				var d = new Date(h.time);
				var dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
				var details = '';
				if (h.note && h.note.floor) details = ' · ' + [h.note.floor, h.note.zone, h.note.spot].filter(Boolean).join('/');
				return '<div class="history-item" onclick="goToHistory(' + h.lat + ',' + h.lng + ')">' +
					'<div class="hi-icon">📍</div>' +
					'<div class="hi-text">' + dateStr + details + '<small>' + h.lat.toFixed(5) + ', ' + h.lng.toFixed(5) + '</small></div>' +
					'</div>';
			}).join('');
		}

		function goToHistory(lat, lng) {
			closeHistory();
			map.setView([lat, lng], 17);
		}

		// ===== STORAGE =====
		function saveCar() {
			localStorage.setItem('parkme_car', JSON.stringify(carPos));
			localStorage.setItem('parkme_time', parkedAt.toString());
			localStorage.setItem('parkme_note', JSON.stringify(parkNote));
			var history = JSON.parse(localStorage.getItem('parkme_history') || '[]');
			history.unshift({ lat: carPos.lat, lng: carPos.lng, time: parkedAt, note: parkNote });
			if (history.length > 20) history = history.slice(0, 20);
			localStorage.setItem('parkme_history', JSON.stringify(history));
		}

		function loadSavedCar() {
			var saved = localStorage.getItem('parkme_car');
			var savedTime = localStorage.getItem('parkme_time');
			var savedNote = localStorage.getItem('parkme_note');
			if (saved) {
				carPos = JSON.parse(saved);
				parkedAt = savedTime ? parseInt(savedTime) : Date.now();
				parkNote = savedNote ? JSON.parse(savedNote) : { floor: '', zone: '', spot: '', note: '' };
				placeCarMarker();
				showParkedUI();
			}
		}

		// ===== MATH =====
		function getDist(lat1, lon1, lat2, lon2) {
			var R = 6371000;
			var dLat = (lat2 - lat1) * Math.PI / 180;
			var dLon = (lon2 - lon1) * Math.PI / 180;
			var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
				Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
				Math.sin(dLon/2)*Math.sin(dLon/2);
			return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
		}

		function getBearing(lat1, lon1, lat2, lon2) {
			var dLon = (lon2-lon1)*Math.PI/180;
			var y = Math.sin(dLon)*Math.cos(lat2*Math.PI/180);
			var x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) -
				Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLon);
			return ((Math.atan2(y,x)*180/Math.PI)+360)%360;
		}

		// ===== UTILS =====
		function showToast(msg, err) {
			var el = document.getElementById('toast');
			el.textContent = msg;
			el.className = 'toast show' + (err ? ' error' : '');
			setTimeout(function() { el.className = 'toast'; }, 2500);
		}

		function hide(id) { document.getElementById(id).classList.add('hidden'); }

		function vibrate(pattern) {
			if (navigator.vibrate) navigator.vibrate(pattern);
		}

		// ===== EVENT LISTENERS =====
		document.getElementById('btn-center').addEventListener('click', function() {
			if (userPos) map.setView([userPos.lat, userPos.lng], 17);
		});
		document.getElementById('btn-history').addEventListener('click', openHistory);
		document.getElementById('close-history').addEventListener('click', closeHistory);
		document.getElementById('history-overlay').addEventListener('click', closeHistory);
		document.getElementById('fab-center').addEventListener('click', function() {
			if (userPos) map.setView([userPos.lat, userPos.lng], 17);
		});
		document.getElementById('fab-zoom-in').addEventListener('click', function() { map.zoomIn(); });
		document.getElementById('fab-zoom-out').addEventListener('click', function() { map.zoomOut(); });

		// ===== SERVICE WORKER =====
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('sw.js').catch(function() {});
		}

		// ===== START =====
		init();
	</script>
</body>
</html>
